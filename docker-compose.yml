services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-asistente}
      POSTGRES_USER: ${POSTGRES_USER:-asistente}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asistente_dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-asistente}:${POSTGRES_PASSWORD:-asistente_dev}@db:5432/${POSTGRES_DB:-asistente}
      PRIVATE_MEDIA_ROOT: /data/private
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - private-data:/data/private

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-asistente}:${POSTGRES_PASSWORD:-asistente_dev}@db:5432/${POSTGRES_DB:-asistente}
      PRIVATE_MEDIA_ROOT: /data/private
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,web}
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3", "--access-logfile", "-"]
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - private-data:/data/private

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-asistente}:${POSTGRES_PASSWORD:-asistente_dev}@db:5432/${POSTGRES_DB:-asistente}
      PRIVATE_MEDIA_ROOT: /data/private
    command: ["python", "manage.py", "run_worker", "--poll-interval", "1"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - private-data:/data/private

  worker-ai:
    profiles: [ai]
    build: .
    restart: on-failure
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-asistente}:${POSTGRES_PASSWORD:-asistente_dev}@db:5432/${POSTGRES_DB:-asistente}
      PRIVATE_MEDIA_ROOT: /data/private
    command: ["python", "manage.py", "run_worker", "--ai-only", "--poll-interval", "1"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      ollama:
        condition: service_started
    volumes:
      - private-data:/data/private:ro
    networks: [default, ai-private]

  ollama:
    profiles: [ai]
    image: ollama/ollama:0.40.16
    restart: unless-stopped
    gpus: all
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
    networks: [ai-private]
    volumes:
      - ollama-models:/root/.ollama

networks:
  ai-private:
    internal: true

volumes:
  ollama-models:
    name: appgestiondocumental-ollama-models
  postgres-data:
  private-data:
