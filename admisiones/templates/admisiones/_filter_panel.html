{% load asset_urls %}
<details class="filter-disclosure{% if wide_filters %} filter-disclosure-wide{% endif %}" open{% if filter_query or filter_form.errors %} data-has-selection{% endif %}>
  <summary class="filter-panel-heading">
    <svg class="filter-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 6h16l-6.5 7v4.5l-3 2V13Z"/></svg>
    <span>Filtros</span>
    {% if filter_query %}<span class="filter-applied">Aplicados</span>{% endif %}
    <svg class="filter-icon filter-chevron" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m6 9 6 6 6-6"/></svg>
  </summary>
  <form class="filter-form" method="get" action="{{ filter_url }}" role="search" aria-label="{{ filter_label }}">
    <div class="filter-fields">
      {% for field in filter_form %}
        <div class="field{% if field.name == 'q' %} filter-search{% endif %}{% if field.errors %} field-invalid{% endif %}">
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          {% if field.name == 'q' %}
            <div class="filter-search-control">
              <svg class="filter-icon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 5 5"/></svg>
              {{ field }}
            </div>
          {% else %}
            {{ field }}
          {% endif %}
          {{ field.errors }}
        </div>
      {% endfor %}
    </div>
    <div class="filter-actions">
      <a class="button button-secondary" href="{{ request.path }}">Limpiar</a>
      <noscript><button class="button button-primary" type="submit">Aplicar</button></noscript>
    </div>
  </form>
</details>
<script src="{% versioned_static 'admisiones/js/listing_filters.js' %}" defer></script>
